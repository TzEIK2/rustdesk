name: Full Flutter CI

on:
# 新增：推送代码自动触发
  push:
    branches: [ master ]
    # Trigger on source, workflow files and build config changes.
    paths:
      - 'src/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flutter/**'
      - '.github/workflows/**'

  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      scope: "x86_64-portable"
