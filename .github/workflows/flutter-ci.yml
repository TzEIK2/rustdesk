name: Full Flutter CI

on:
  push:
    branches: [ master ]
    # Trigger on source, workflow files and build config changes.
    paths:
      - 'src/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flutter/**'
      - '.github/workflows/**'

  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      # Build only the Windows x86_64 portable packer path — skips Linux/macOS/
      # Android/iOS/Web/sciter/publish jobs. Leave unset or set "full" for nightly.
      BUILD_SCOPE: "x86_64-portable"
