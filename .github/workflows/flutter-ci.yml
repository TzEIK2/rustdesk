name: Full Flutter CI

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flutter/**'
      - '.github/workflows/**'

  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      # Skip Linux/macOS/Android/iOS/Web/sciter/publish — only build Windows x86_64 portable.
      PORTABLE_ONLY: true
