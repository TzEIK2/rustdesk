name: Full Flutter CI

on:
  push:
    branches: [ master ]
    # Trigger on source, workflow files and build config changes.
    paths:
      - 'src/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flutter/**'
      - '.github/workflows/**'

  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"

# BUILD_SCOPE is inherited by flutter-build.yml (called workflow reads env.BUILD_SCOPE).
# Empty/unset = full build; "x86_64-portable" = only Windows x86_64 portable packer.
env:
  BUILD_SCOPE: "x86_64-portable"

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
